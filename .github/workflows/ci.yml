name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 本项目零运行时依赖，这一步只是为了确认没有意外的依赖引入。
      - name: 依赖检查
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts; fi

      - name: 语法检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 冒烟测试（启动服务并请求健康检查）
        run: |
          node server.js &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4173/api/health > /dev/null; then
              echo "服务已就绪"
              curl -s http://127.0.0.1:4173/api/health
              exit 0
            fi
            sleep 1
          done
          echo "服务启动超时"
          exit 1
